<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComptaPro — Maîtrise totale de la comptabilité & l'audit</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --bg:#0a0f1a; --panel:#121c2e; --panel-2:#1a2639; --border:#2a3850;
    --accent:#3b82f6; --accent-light:#60a5fa; --accent-dark:#1e40af;
    --gold:#fbbf24; --gold-light:#fcd34d; --teal:#10b981;
    --text:#e8eaf0; --text-dim:#8892a7;
    --success:#10b981; --success-light:#34d399; --error:#ef4444; --warn:#f59e0b;
    --shadow:rgba(0,0,0,0.5);
}
body.light {
    --bg:#f5f7fb; --panel:#ffffff; --panel-2:#f1f5f9; --border:#e2e8f0;
    --text:#0f172a; --text-dim:#64748b; --shadow:rgba(15,23,42,0.12);
    background: radial-gradient(ellipse at top, #e0e7ff 0%, #f5f7fb 60%);
}
body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: radial-gradient(ellipse at top, #101828 0%, #0a0f1a 60%);
    color: var(--text); min-height: 100vh; padding-bottom: 3rem; line-height: 1.5;
    transition: background 0.3s, color 0.3s;
}
.container { max-width: 1200px; margin: 0 auto; padding: 1rem; }
.app-header { text-align: center; padding: 2rem 0 1rem; }
.app-header h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: 0.02em;
    background: linear-gradient(135deg, var(--gold), var(--accent-light), var(--teal));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; }
.app-header p { color: var(--text-dim); font-size: 0.95rem; margin-top: 0.3rem; font-style: italic; }
.user-stats { display: flex; justify-content: center; gap: 0.8rem; flex-wrap: wrap; margin-top: 1rem; }
.stat-badge { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 0.5rem 1rem; font-size: 0.85rem; color: var(--text); }
.stat-badge strong { color: var(--gold); font-variant-numeric: tabular-nums; }
.nav-tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: center; margin: 1.5rem 0; }
.nav-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 0.55rem 0.85rem; border-radius: 10px; cursor: pointer; font-size: 0.78rem;
    transition: all 0.2s; font-weight: 500; }
.nav-btn:hover { border-color: var(--accent); color: var(--accent-light); }
.nav-btn.active { background: var(--accent-dark); color: #fff; border-color: var(--accent); }
.view { display: none; animation: fadeIn 0.3s ease; }
.view.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 1.3rem; margin-bottom: 1rem; }
.card-title { font-size: 1.05rem; font-weight: 600; color: var(--accent-light);
    margin-bottom: 0.8rem; display: flex; align-items: center; gap: 0.5rem; }
.section-title { font-size: 1.5rem; font-weight: 700; color: var(--text);
    margin: 1.5rem 0 1rem; text-align: center; }
.section-subtitle { text-align: center; color: var(--text-dim); font-size: 0.9rem;
    margin-bottom: 1.5rem; }
.btn { background: var(--accent-dark); color: #fff; border: none; padding: 0.7rem 1.4rem;
    border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
    transition: all 0.2s; font-family: inherit; }
.btn:hover:not(:disabled) { background: var(--accent); transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-gold { background: linear-gradient(135deg, var(--gold), #f59e0b); color: #0a0f1a; }
.btn-gold:hover:not(:disabled) { background: linear-gradient(135deg, var(--gold-light), var(--gold)); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-ghost:hover:not(:disabled) { background: var(--panel-2); border-color: var(--accent); }
.btn-danger { background: var(--error); color: #fff; }
.btn-sm { padding: 0.45rem 0.85rem; font-size: 0.78rem; }
.btn-xs { padding: 0.28rem 0.6rem; font-size: 0.7rem; }
.progress-bar { background: rgba(0,0,0,0.3); border-radius: 8px; height: 10px; overflow: hidden;
    border: 1px solid var(--border); }
body.light .progress-bar { background: #e2e8f0; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold));
    transition: width 0.4s; border-radius: 8px; }
.progress-label { display: flex; justify-content: space-between; font-size: 0.75rem;
    color: var(--text-dim); margin-bottom: 0.3rem; }
.dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem; margin-bottom: 1.5rem; }
.dash-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 1.1rem; text-align: center; transition: transform 0.2s; }
.dash-card:hover { transform: translateY(-2px); }
.dash-card .icon { font-size: 1.9rem; margin-bottom: 0.4rem; }
.dash-card .label { font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 0.08em; }
.dash-card .value { font-size: 1.6rem; font-weight: 700; color: var(--gold);
    font-variant-numeric: tabular-nums; margin-top: 0.2rem; }
.dash-card .sub { font-size: 0.72rem; color: var(--text-dim); margin-top: 0.3rem; }
.tip-of-day { background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(251,191,36,0.08));
    border: 1px solid var(--accent); border-radius: 14px; padding: 1.5rem;
    margin-bottom: 1rem; position: relative; overflow: hidden; }
.tip-of-day::before { content: "📊"; position: absolute; top: -20px; right: -10px;
    font-size: 110px; opacity: 0.05; pointer-events: none; }
.tip-of-day .label-day { font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 0.1em; margin-bottom: 0.6rem; }
.tip-of-day .title { font-size: 1.15rem; font-weight: 700; color: var(--gold); margin-bottom: 0.5rem; }
.tip-of-day .text { color: var(--text); font-size: 0.92rem; line-height: 1.6; }
.tip-of-day .example { margin-top: 0.7rem; padding: 0.7rem 0.9rem; background: var(--panel-2);
    border-radius: 8px; border-left: 3px solid var(--gold); font-size: 0.85rem; font-family: 'Courier New', monospace; }
.goal-widget { background: linear-gradient(135deg, rgba(251,191,36,0.1), rgba(59,130,246,0.1));
    border: 1px solid var(--gold); border-radius: 14px; padding: 1.2rem; margin-bottom: 1rem; }
.goal-widget .g-label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 0.08em; }
.goal-widget .g-value { font-size: 1.4rem; font-weight: 700; color: var(--gold); margin: 0.2rem 0; }
.concepts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 0.8rem; }
.concept-tile { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 1rem; cursor: pointer; transition: all 0.2s; position: relative; }
.concept-tile:hover { border-color: var(--accent); transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(59, 130, 246, 0.2); }
.concept-tile.learned { border-color: var(--success); background: rgba(16, 185, 129, 0.06); }
.concept-tile.learned::after { content: "✓"; position: absolute; top: 6px; right: 10px;
    color: var(--success); font-size: 0.9rem; font-weight: 700; }
.concept-tile .icon { font-size: 1.6rem; margin-bottom: 0.3rem; }
.concept-tile .name { font-size: 0.88rem; font-weight: 600; color: var(--gold); }
.concept-tile .cat { font-size: 0.66rem; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 0.05em; margin-top: 0.2rem; }
.concept-tile .preview { font-size: 0.72rem; color: var(--text-dim); margin-top: 0.4rem;
    line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none;
    align-items: center; justify-content: center; padding: 1rem; z-index: 100;
    overflow-y: auto; backdrop-filter: blur(4px); }
.modal-overlay.visible { display: flex; }
.modal { background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 1.5rem; max-width: 620px; width: 100%; animation: popIn 0.25s;
    margin: auto; max-height: 92vh; overflow-y: auto; }
@keyframes popIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal .m-title { font-size: 1.3rem; font-weight: 700; color: var(--gold); margin-bottom: 0.3rem; }
.modal .m-cat { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 0.08em; margin-bottom: 0.8rem; }
.modal .m-def { color: var(--text); font-size: 0.92rem; line-height: 1.6; margin-bottom: 1rem;
    padding: 0.9rem 1rem; background: var(--panel-2); border-radius: 10px;
    border-left: 3px solid var(--accent); }
.modal .m-section-label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 0.08em; margin: 0.8rem 0 0.4rem; font-weight: 600; }
.modal .m-example { font-family: 'Courier New', monospace; font-size: 0.82rem;
    color: var(--accent-light); line-height: 1.7; background: var(--panel-2);
    padding: 0.8rem 1rem; border-radius: 8px; white-space: pre-wrap;
    border-left: 3px solid var(--gold); }
.modal-actions { display: flex; gap: 0.4rem; justify-content: center; flex-wrap: wrap;
    margin-top: 1rem; }
.vocab-controls { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1rem;
    flex-wrap: wrap; }
.flashcard { background: linear-gradient(135deg, var(--panel), var(--panel-2));
    border: 1px solid var(--border); border-radius: 18px; padding: 2.5rem 1.5rem;
    text-align: center; min-height: 220px; display: flex; flex-direction: column;
    justify-content: center; cursor: pointer; transition: transform 0.2s; margin: 0 auto;
    max-width: 540px; user-select: none; }
.flashcard:hover { transform: translateY(-2px); }
.flashcard .term { font-size: 1.7rem; font-weight: 700; color: var(--gold); line-height: 1.3; }
.flashcard .en { font-style: italic; color: var(--text-dim); margin-top: 0.4rem; font-size: 0.9rem; }
.flashcard .def { font-size: 1rem; color: var(--success-light); margin-top: 1rem;
    font-weight: 500; display: none; line-height: 1.6; }
.flashcard.revealed .def { display: block; animation: fadeIn 0.3s; }
.flashcard .hint { color: var(--text-dim); font-size: 0.8rem; margin-top: 1rem; }
.vocab-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 0.7rem; }
.vocab-item { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 0.7rem 0.9rem; }
.vocab-item .term { font-weight: 600; color: var(--gold); font-size: 0.92rem; }
.vocab-item .cat-badge { display: inline-block; font-size: 0.6rem; padding: 0.1rem 0.4rem;
    background: var(--accent-dark); color: #fff; border-radius: 4px; margin-left: 0.4rem; }
.vocab-item .def { font-size: 0.78rem; color: var(--text-dim); margin-top: 0.3rem; line-height: 1.4; }
.search-input { width: 100%; max-width: 400px; margin: 0 auto 1rem; display: block;
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 0.65rem 1rem; border-radius: 10px; font-size: 0.88rem; font-family: inherit; }
.search-input:focus { outline: none; border-color: var(--accent); }
.entry-list { display: flex; flex-direction: column; gap: 0.8rem; }
.entry-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; }
.entry-header { padding: 1rem 1.2rem; cursor: pointer; display: flex;
    justify-content: space-between; align-items: center; gap: 1rem; transition: background 0.2s; }
.entry-header:hover { background: var(--panel-2); }
.entry-header .entry-title { font-size: 1rem; font-weight: 600; color: var(--text); }
.entry-header .entry-meta { font-size: 0.72rem; color: var(--text-dim); margin-top: 0.2rem; }
.entry-num-badge { display: inline-block; background: var(--accent-dark); color: #fff;
    font-size: 0.62rem; padding: 0.15rem 0.45rem; border-radius: 4px; margin-right: 0.4rem;
    vertical-align: middle; }
.entry-body { display: none; padding: 0 1.2rem 1.2rem; }
.entry-card.open .entry-body { display: block; animation: fadeIn 0.3s; }
.entry-desc { color: var(--text); font-size: 0.9rem; margin-bottom: 0.8rem;
    padding: 0.7rem; background: var(--panel-2); border-radius: 8px; }
.journal-table { width: 100%; border-collapse: collapse; margin: 0.8rem 0;
    font-family: 'Courier New', monospace; font-size: 0.82rem; }
.journal-table th { background: var(--accent-dark); color: #fff; padding: 0.5rem;
    text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
.journal-table td { padding: 0.5rem; border-bottom: 1px solid var(--border); }
.journal-table td.amount { text-align: right; font-variant-numeric: tabular-nums; color: var(--gold); }
.journal-table tr.total td { border-top: 2px solid var(--gold); font-weight: 700; color: var(--gold); }
.journal-table td.debit { color: var(--accent-light); }
.journal-table td.credit { color: var(--success-light); padding-left: 2rem; }
.entry-explanation { background: linear-gradient(135deg, rgba(16,185,129,0.08), rgba(59,130,246,0.08));
    border-left: 3px solid var(--teal); border-radius: 8px; padding: 0.8rem 1rem;
    font-size: 0.85rem; color: var(--text); line-height: 1.6; margin-top: 0.5rem; }
.ratio-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 1.2rem; margin-bottom: 0.8rem; }
.ratio-card .r-name { font-size: 1.05rem; font-weight: 700; color: var(--gold); margin-bottom: 0.4rem; }
.ratio-card .r-formula { font-family: 'Courier New', monospace; background: var(--panel-2);
    padding: 0.7rem 1rem; border-radius: 8px; color: var(--accent-light); font-size: 0.85rem;
    margin: 0.6rem 0; border-left: 3px solid var(--accent); }
.ratio-card .r-interp { color: var(--text-dim); font-size: 0.85rem; line-height: 1.5; }
.ratio-card .r-interp strong { color: var(--success-light); }
.audit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 0.8rem; }
.audit-card { background: linear-gradient(135deg, var(--panel-2), var(--panel));
    border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem; }
.audit-card .a-title { font-size: 0.95rem; font-weight: 700; color: var(--gold);
    margin-bottom: 0.4rem; }
.audit-card .a-desc { font-size: 0.82rem; color: var(--text); line-height: 1.5; }
.audit-card .a-example { font-size: 0.75rem; color: var(--accent-light); font-style: italic;
    margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--border); }
.risk-formula { background: linear-gradient(135deg, rgba(251,191,36,0.15), rgba(59,130,246,0.1));
    border: 1px solid var(--gold); border-radius: 14px; padding: 1.2rem; text-align: center;
    margin: 1rem 0; }
.risk-formula .formula { font-size: 1.15rem; font-weight: 700; color: var(--gold);
    font-family: 'Courier New', monospace; }
.risk-formula .detail { font-size: 0.8rem; color: var(--text-dim); margin-top: 0.5rem; }
.quiz-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 1.5rem; max-width: 640px; margin: 1rem auto; }
.quiz-progress { display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 1rem; font-size: 0.82rem; color: var(--text-dim); }
.quiz-question { font-size: 1.05rem; text-align: center; margin: 1.3rem 0 1.6rem;
    line-height: 1.5; }
.quiz-question .big { font-size: 1.5rem; color: var(--gold); display: block;
    margin-bottom: 0.5rem; font-weight: 700; }
.quiz-question .hint { color: var(--text-dim); font-size: 0.82rem; font-style: italic; }
.quiz-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 0.6rem; }
.quiz-option { background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 0.9rem; border-radius: 10px; cursor: pointer; font-size: 0.9rem; text-align: center;
    transition: all 0.15s; font-family: inherit; }
.quiz-option:hover:not(:disabled) { border-color: var(--accent); background: rgba(59, 130, 246, 0.1); }
.quiz-option.correct { background: rgba(16, 185, 129, 0.15); border-color: var(--success); color: var(--success-light); }
.quiz-option.wrong { background: rgba(239, 68, 68, 0.15); border-color: var(--error); color: #fca5a5; }
.quiz-option:disabled { cursor: default; }
.quiz-feedback { text-align: center; margin-top: 1rem; font-weight: 600; min-height: 1.5rem; }
.quiz-feedback.ok { color: var(--success-light); }
.quiz-feedback.ko { color: #fca5a5; }
.result-panel { text-align: center; padding: 2rem 1rem; }
.result-panel .big-emoji { font-size: 3.5rem; margin-bottom: 0.8rem; }
.result-panel .result-title { font-size: 1.5rem; font-weight: 700; color: var(--gold);
    margin-bottom: 0.5rem; }
.result-panel .result-score { font-size: 1.05rem; color: var(--text); margin-bottom: 1.5rem; }
.exercise-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem; margin-top: 1rem; }
.exercise-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 1.2rem; text-align: center; cursor: pointer; transition: all 0.2s; }
.exercise-card:hover { border-color: var(--accent); transform: translateY(-3px); }
.exercise-card .ex-icon { font-size: 2rem; margin-bottom: 0.5rem; }
.exercise-card .ex-title { font-weight: 600; color: var(--text); margin-bottom: 0.3rem; font-size: 0.92rem; }
.exercise-card .ex-desc { font-size: 0.75rem; color: var(--text-dim); }
.exercise-card.daily { border-color: var(--gold);
    background: linear-gradient(135deg, var(--panel), rgba(251,191,36,0.05)); }
.exercise-card.done { opacity: 0.6; }
.badges-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
    gap: 0.7rem; }
.badge-item { background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px;
    padding: 0.9rem 0.4rem; text-align: center; opacity: 0.4; transition: all 0.3s; }
.badge-item.earned { opacity: 1; border-color: var(--gold);
    box-shadow: 0 0 15px rgba(251, 191, 36, 0.2); }
.badge-item .b-icon { font-size: 1.8rem; }
.badge-item .b-name { font-size: 0.66rem; color: var(--text); margin-top: 0.35rem; font-weight: 600; }
.badge-item .b-desc { font-size: 0.6rem; color: var(--text-dim); margin-top: 0.15rem; }
.bilan-table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.85rem; }
.bilan-table th { background: var(--accent-dark); color: #fff; padding: 0.7rem;
    text-align: left; font-size: 0.72rem; text-transform: uppercase; }
.bilan-table td { padding: 0.6rem 0.7rem; border-bottom: 1px solid var(--border); }
.bilan-table tr.subtotal td { background: rgba(251,191,36,0.08); font-weight: 700; color: var(--gold); }
.bilan-table tr.total td { background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(251,191,36,0.15));
    font-weight: 800; color: var(--gold); font-size: 0.95rem; }
.bilan-table td.amount { text-align: right; font-variant-numeric: tabular-nums; }
.bilan-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 1rem 0; }
.bilan-side h4 { color: var(--accent-light); font-size: 0.9rem; margin-bottom: 0.5rem;
    padding-bottom: 0.3rem; border-bottom: 2px solid var(--accent); }
.bilan-line { display: flex; justify-content: space-between; padding: 0.4rem 0.5rem;
    border-bottom: 1px dotted var(--border); font-size: 0.82rem; }
.bilan-line.subtotal { background: rgba(251,191,36,0.08); font-weight: 700; color: var(--gold); }
.bilan-line.total { background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(251,191,36,0.1));
    font-weight: 800; color: var(--gold); font-size: 0.9rem; }
.bilan-line .amount { font-variant-numeric: tabular-nums; }
.case-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 1.3rem; margin-bottom: 1rem; }
.case-card .case-title { font-size: 1.05rem; font-weight: 700; color: var(--gold);
    margin-bottom: 0.5rem; }
.case-card .case-context { font-size: 0.85rem; color: var(--text-dim); line-height: 1.6;
    padding: 0.7rem 0.9rem; background: var(--panel-2); border-radius: 8px; margin-bottom: 0.8rem; }
.case-card .case-question { font-size: 0.9rem; color: var(--text); margin: 0.6rem 0;
    padding-left: 1rem; border-left: 3px solid var(--accent); }
.case-card .case-answer { display: none; margin-top: 0.7rem; padding: 0.9rem;
    background: rgba(16,185,129,0.08); border-radius: 8px; font-size: 0.85rem;
    line-height: 1.6; border-left: 3px solid var(--teal); }
.case-card .case-answer.visible { display: block; animation: fadeIn 0.3s; }
.history-list { display: flex; flex-direction: column; gap: 0.5rem; }
.history-item { display: flex; justify-content: space-between; align-items: center;
    background: var(--panel-2); padding: 0.6rem 0.9rem; border-radius: 8px; font-size: 0.82rem; }
.history-item .h-date { color: var(--text-dim); font-size: 0.72rem; }
.history-item .h-score { color: var(--gold); font-weight: 700; }
.bar-chart { display: flex; align-items: flex-end; gap: 0.5rem; height: 120px;
    padding: 0.5rem 0; border-bottom: 1px solid var(--border); margin-bottom: 0.5rem; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
    height: 100%; justify-content: flex-end; }
.bar-col .bar-fill { width: 70%; background: linear-gradient(180deg, var(--accent-light), var(--accent-dark));
    border-radius: 4px 4px 0 0; min-height: 3px; transition: height 0.4s; }
.bar-col .bar-label { font-size: 0.62rem; color: var(--text-dim); }
.setting-row { display: flex; justify-content: space-between; align-items: center;
    padding: 0.85rem 0; border-bottom: 1px solid var(--border); gap: 1rem; }
.setting-row:last-child { border-bottom: none; }
.setting-row .s-label { font-size: 0.88rem; color: var(--text); }
.setting-row .s-desc { font-size: 0.72rem; color: var(--text-dim); margin-top: 0.15rem; }
.toggle { position: relative; width: 44px; height: 24px; background: var(--border); border-radius: 12px;
    cursor: pointer; transition: background 0.2s; flex-shrink: 0; border: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
    background: #fff; border-radius: 50%; transition: transform 0.2s; }
.toggle.on { background: var(--accent); }
.toggle.on::after { transform: translateX(20px); }
.confetti-container { position: fixed; inset: 0; pointer-events: none; z-index: 300; overflow: hidden; }
.confetti { position: absolute; width: 8px; height: 14px; top: -20px;
    animation: confettiFall 2.5s linear forwards; }
@keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--panel); border: 1px solid var(--gold); color: var(--text);
    padding: 0.8rem 1.5rem; border-radius: 12px; font-size: 0.88rem; z-index: 200;
    opacity: 0; transition: all 0.3s; box-shadow: 0 8px 30px var(--shadow); max-width: 90%; text-align: center; }
.toast.visible { transform: translateX(-50%) translateY(0); opacity: 1; }
.hidden { display: none !important; }
.text-center { text-align: center; }
.mt-1 { margin-top: 1rem; }

/* Calculators */
.calc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
.calc-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 1.2rem; }
.calc-card h3 { color: var(--gold); font-size: 1rem; margin-bottom: 0.8rem;
    padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }
.calc-field { display: flex; justify-content: space-between; align-items: center;
    gap: 0.5rem; margin-bottom: 0.6rem; }
.calc-field label { font-size: 0.82rem; color: var(--text); flex: 1; }
.calc-field input, .calc-field select { background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); padding: 0.5rem 0.7rem; border-radius: 8px; font-size: 0.85rem;
    width: 130px; font-family: inherit; text-align: right; }
.calc-field input:focus, .calc-field select:focus { outline: none; border-color: var(--accent); }
.calc-result { margin-top: 0.8rem; padding: 0.8rem; background: var(--panel-2);
    border-radius: 8px; border-left: 3px solid var(--gold); font-size: 0.85rem;
    line-height: 1.7; display: none; }
.calc-result.visible { display: block; animation: fadeIn 0.3s; }
.calc-result .res-line { display: flex; justify-content: space-between; padding: 0.2rem 0;
    border-bottom: 1px dotted var(--border); }
.calc-result .res-line:last-child { border-bottom: none; font-weight: 700; color: var(--gold); }
.calc-result table { width: 100%; border-collapse: collapse; font-family: 'Courier New', monospace;
    font-size: 0.75rem; margin-top: 0.5rem; }
.calc-result table th { background: var(--accent-dark); color: #fff; padding: 0.4rem; }
.calc-result table td { padding: 0.35rem 0.4rem; border-bottom: 1px solid var(--border); text-align: right; }
.calc-result table td:first-child { text-align: left; }

@media (max-width: 600px) {
    .app-header h1 { font-size: 1.6rem; }
    .nav-btn { padding: 0.45rem 0.65rem; font-size: 0.68rem; }
    .bilan-two-col { grid-template-columns: 1fr; }
    .bilan-table { font-size: 0.75rem; }
    .bilan-table th, .bilan-table td { padding: 0.4rem; }
    .journal-table { font-size: 0.72rem; }
    .journal-table th, .journal-table td { padding: 0.35rem; }
    .calc-field input, .calc-field select { width: 110px; }
}
</style>

const STORAGE_KEY = 'comptapro_state_v2';
const defaultState = {
    xp: 0, streak: 0, lastVisit: null,
    learnedConcepts: [], learnedWords: [], viewedEntries: [],
    viewedRatios: [], viewedAudit: [], viewedStatements: false,
    exploredCases: [], earnedBadges: [], usedCalculators: [],
    vocabSRS: {}, lastDailyChallenge: null, dailyGoal: 30, todayXP: 0, lastXPDate: null,
    stats: { correct: 0, wrong: 0, history: [], perfectCount: 0 },
    settings: { theme: 'dark' }
};
let state = loadState();
function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(defaultState));
        const s = JSON.parse(raw);
        return { ...defaultState, ...s,
            stats: { ...defaultState.stats, ...(s.stats || {}) },
            settings: { ...defaultState.settings, ...(s.settings || {}) },
            vocabSRS: s.vocabSRS || {} };
    } catch (e) { return JSON.parse(JSON.stringify(defaultState)); }
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function updateStreak() {
    const today = new Date().toDateString();
    if (state.lastVisit === today) return;
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    if (state.lastVisit === yesterday) state.streak += 1;
    else state.streak = 1;
    state.lastVisit = today; saveState();
}
function resetDailyXPIfNeeded() {
    const today = new Date().toDateString();
    if (state.lastXPDate !== today) {
        state.todayXP = 0; state.lastXPDate = today; saveState();
    }
}
function levelFromXP(xp) {
    if (xp < 100) return 1; if (xp < 300) return 2; if (xp < 600) return 3;
    if (xp < 1000) return 4; if (xp < 1500) return 5;
    return 6 + Math.floor((xp - 1500) / 500);
}
function xpForNextLevel(xp) {
    const l = levelFromXP(xp); const t = [0, 100, 300, 600, 1000, 1500];
    if (l <= 5) return t[l];
    return 1500 + (l - 5) * 500;
}
function xpForCurrentLevel(xp) {
    const l = levelFromXP(xp); const t = [0, 0, 100, 300, 600, 1000];
    if (l <= 5) return t[l];
    return 1500 + (l - 6) * 500;
}
function addXP(amount, reason) {
    resetDailyXPIfNeeded();
    state.xp += amount; state.todayXP += amount;
    const before = levelFromXP(state.xp - amount);
    const after = levelFromXP(state.xp);
    saveState(); updateHeader();
    showToast('+' + amount + ' XP' + (reason ? ' — ' + reason : ''));
    if (after > before) {
        setTimeout(function() { showToast('🎉 Niveau ' + after + ' !'); }, 1500);
        if (after >= 3) awardBadge('level-3');
        if (after >= 5) awardBadge('level-5');
    }
    if (state.todayXP >= state.dailyGoal) awardBadge('goal-reached');
}
function awardBadge(id) {
    if (state.earnedBadges.indexOf(id) !== -1) return;
    state.earnedBadges.push(id); saveState();
    const b = BADGES.find(function(x) { return x.id === id; });
    if (b) setTimeout(function() { showToast('🏅 Badge : ' + b.name); launchConfetti(); }, 800);
}
function launchConfetti() {
    const container = document.getElementById('confetti-container');
    const colors = ['#fbbf24', '#3b82f6', '#10b981', '#ef4444', '#fcd34d', '#60a5fa'];
    for (let i = 0; i < 40; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.style.left = Math.random() * 100 + '%';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.animationDelay = Math.random() * 0.4 + 's';
        el.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
        el.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
        container.appendChild(el);
        setTimeout(function() { el.remove(); }, 3000);
    }
}
function checkBadges() {
    if (state.learnedConcepts.length >= 1) awardBadge('first-concept');
    if (state.learnedConcepts.length >= 10) awardBadge('ten-concepts');
    if (state.learnedConcepts.length >= CONCEPTS.length) awardBadge('all-concepts');
    if (state.learnedWords.length >= 1) awardBadge('first-word');
    if (state.learnedWords.length >= 20) awardBadge('twenty-words');
    if (state.learnedWords.length >= 40) awardBadge('forty-words');
    if (state.viewedEntries.length >= 1) awardBadge('first-entry');
    if (state.viewedEntries.length >= 10) awardBadge('ten-entries');
    if (state.streak >= 3) awardBadge('streak-3');
    if (state.streak >= 7) awardBadge('streak-7');
    if (state.streak >= 30) awardBadge('streak-30');
    if (state.viewedRatios.length >= RATIOS.length) awardBadge('ratio-master');
    if (state.viewedAudit.length >= AUDIT_CONCEPTS.length) awardBadge('audit-master');
    if (state.exploredCases.length >= 1) awardBadge('case-explorer');
    if (state.exploredCases.length >= CASE_STUDIES.length) awardBadge('case-master');
    if (state.viewedStatements) awardBadge('statement-viewer');
    if (state.usedCalculators.length >= 5) awardBadge('calculator-pro');
}
function updateHeader() {
    document.getElementById('xp-value').textContent = state.xp;
    document.getElementById('streak-value').textContent = state.streak;
    document.getElementById('level-value').textContent = levelFromXP(state.xp);
    document.getElementById('learned-count').textContent =
        state.learnedConcepts.length + state.learnedWords.length + state.viewedEntries.length;
}
let toastTimer;
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { t.classList.remove('visible'); }, 2600);
}
function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
}
function escapeAttr(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function escapeHTML(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function todayKey() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); }
function highlight(text, query) {
    if (!query) return escapeHTML(text);
    const safe = escapeHTML(text);
    const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return safe.replace(re, '<span style="background:rgba(251,191,36,0.3); color:var(--gold); padding:0 2px; border-radius:3px;">$1</span>');
}

function modeFlashcards() {
    const el = document.getElementById('vocab-content');
    if (!vocabShuffled.length) vocabShuffled = shuffle(LEXICON.map(function(_, i) { return i; }));
    const idx = vocabShuffled[vocabIndex];
    const v = LEXICON[idx];
    el.innerHTML = `
        <div class="flashcard" onclick="this.classList.toggle('revealed')">
            <div class="term">${v.term}</div>
            <div class="en">${v.cat}</div>
            <div class="def">${v.def}</div>
            <div class="hint">👆 Clique pour révéler la définition</div>
        </div>
        <div class="vocab-controls" style="margin-top:1.2rem;">
            <button class="btn btn-ghost btn-sm" onclick="prevVocab()">← Préc.</button>
            <button class="btn btn-gold btn-sm" onclick="markWordLearned(${idx})">✓ Appris</button>
            <button class="btn btn-ghost btn-sm" onclick="nextVocab()">Suiv. →</button>
        </div>
        <p style="text-align:center; color:var(--text-dim); font-size:0.78rem; margin-top:1rem;">
            Carte ${vocabIndex + 1} / ${LEXICON.length} — ${state.learnedWords.length} appris
        </p>`;
}
function nextVocab() { vocabIndex = (vocabIndex + 1) % LEXICON.length; modeFlashcards(); }
function prevVocab() { vocabIndex = (vocabIndex - 1 + LEXICON.length) % LEXICON.length; modeFlashcards(); }
function markWordLearned(idx) {
    if (state.learnedWords.indexOf(idx) === -1) {
        state.learnedWords.push(idx);
        saveState(); addXP(4, 'Terme appris'); checkBadges();

function calcAmortLineaire() {
    const valeur = parseFloat(document.getElementById('al-valeur').value) || 0;
    const duree = parseInt(document.getElementById('al-duree').value) || 1;
    const dateStr = document.getElementById('al-date').value;
    const result = document.getElementById('al-result');
    const date = dateStr ? new Date(dateStr) : new Date();
    const dotationAnnuelle = valeur / duree;
    const moisRestants = 12 - date.getMonth();
    const dotation1 = dotationAnnuelle * moisRestants / 12;
    let html = '<div class="res-line"><span>Dotation annuelle pleine</span><span>' + dotationAnnuelle.toLocaleString('fr-FR') + ' €</span></div>';
    html += '<div class="res-line"><span>Dotation 1ère année (' + moisRestants + ' mois)</span><span>' + dotation1.toFixed(2).replace('.', ',') + ' €</span></div>';
    html += '<table><tr><th>Année</th><th>Dotation</th><th>VNC fin</th></tr>';
    let vnc = valeur;
    for (let i = 1; i <= duree; i++) {
        const dot = (i === 1 ? dotation1 : dotationAnnuelle);
        vnc -= dot;
        html += '<tr><td>Année ' + i + '</td><td>' + dot.toFixed(2).replace('.', ',') + '</td><td>' + Math.max(0, vnc).toFixed(2).replace('.', ',') + '</td></tr>';
    }
    html += '</table>';
    result.innerHTML = html;
    result.classList.add('visible');
    markCalculatorUsed('amort-lin');
}
function calcAmortDegressif() {
    const valeur = parseFloat(document.getElementById('ad-valeur').value) || 0;
    const duree = parseInt(document.getElementById('ad-duree').value) || 1;
    const coef = parseFloat(document.getElementById('ad-coef').value) || 1.75;
    const tauxLineaire = 1 / duree;
    const tauxDegressif = tauxLineaire * coef;
    const result = document.getElementById('ad-result');
    let html = '<div class="res-line"><span>Taux linéaire</span><span>' + (tauxLineaire*100).toFixed(1) + '%</span></div>';
    html += '<div class="res-line"><span>Taux dégressif</span><span>' + (tauxDegressif*100).toFixed(2) + '%</span></div>';
    html += '<table><tr><th>Année</th><th>Dotation</th><th>VNC fin</th></tr>';
    let vnc = valeur;
    for (let i = 1; i <= duree; i++) {
        const anneesRestantes = duree - i + 1;
        const tauxLineaireSurVNC = 1 / anneesRestantes;
        const taux = Math.max(tauxDegressif, tauxLineaireSurVNC);
        const dot = vnc * taux;
        vnc -= dot;
        html += '<tr><td>Année ' + i + '</td><td>' + dot.toFixed(2).replace('.', ',') + '</td><td>' + Math.max(0, vnc).toFixed(2).replace('.', ',') + '</td></tr>';
    }
    html += '</table>';
    result.innerHTML = html;
    result.classList.add('visible');
    markCalculatorUsed('amort-deg');
}
function calcTVA() {
    const montant = parseFloat(document.getElementById('tva-montant').value) || 0;
    const taux = parseFloat(document.getElementById('tva-taux').value) || 20;
    const mode = document.getElementById('tva-mode').value;
    const result = document.getElementById('tva-result');
    let ht, tva, ttc;
    if (mode === 'ht') { ht = montant; tva = montant * taux / 100; ttc = ht + tva; }
    else { ttc = montant; tva = ttc * taux / (100 + taux); ht = ttc - tva; }
    result.innerHTML =
        '<div class="res-line"><span>Montant HT</span><span>' + ht.toFixed(2).replace('.', ',') + ' €</span></div>' +
        '<div class="res-line"><span>TVA (' + taux + '%)</span><span>' + tva.toFixed(2).replace('.', ',') + ' €</span></div>' +
        '<div class="res-line"><span>Montant TTC</span><span>' + ttc.toFixed(2).replace('.', ',') + ' €</span></div>';
    result.classList.add('visible');

}
function calcBFR() {
    const rs = parseFloat(document.getElementById('bfr-rs').value) || 0;
    const es = parseFloat(document.getElementById('bfr-es').value) || 0;
    const ac = parseFloat(document.getElementById('bfr-ac').value) || 0;
    const dct = parseFloat(document.getElementById('bfr-dct').value) || 0;
    const fr = rs - es;
    const bfr = ac - dct;

function calcEmprunt() {
    const montant = parseFloat(document.getElementById('emp-montant').value) || 0;
    const taux = parseFloat(document.getElementById('emp-taux').value) / 100 || 0;
    const duree = parseInt(document.getElementById('emp-duree').value) || 1;
    const result = document.getElementById('emp-result');
    const annuite = taux > 0 ? montant * taux / (1 - Math.pow(1 + taux, -duree)) : montant / duree;
    let html = '<div class="res-line"><span>Annuité constante</span><span>' + annuite.toFixed(2).replace('.', ',') + ' €</span></div>';
    html += '<table><tr><th>Année</th><th>Intérêts</th><th>Capital</th><th>Capital restant</th></tr>';
    let capital = montant;
    for (let i = 1; i <= duree; i++) {
        const interets = capital * taux;
        const capitalRembourse = annuite - interets;
        capital -= capitalRembourse;
        html += '<tr><td>' + i + '</td><td>' + interets.toFixed(2).replace('.', ',') + '</td><td>' + capitalRembourse.toFixed(2).replace('.', ',') + '</td><td>' + Math.max(0, capital).toFixed(2).replace('.', ',') + '</td></tr>';
    }
    html += '</table>';
    result.innerHTML = html;
    result.classList.add('visible');
    markCalculatorUsed('emprunt');
}
function calcSalaire() {

function calcRatios() {

function buildQuestions(type, n) {
    n = n || 10;
    if (type === 'calc') return buildCalcQuestions(n);
    const qs = [];
    const incC = (type === 'concepts' || type === 'mix');
    const incA = (type === 'accounts' || type === 'mix');
    const incJ = (type === 'journal' || type === 'mix');
    const incR = (type === 'ratios' || type === 'mix');
    const incAu = (type === 'audit' || type === 'mix');
    const incCalc = (type === 'mix');
    if (incC) {
        const count = type === 'mix' ? 2 : n;
        shuffle(CONCEPTS.map(function(_, i) { return i; })).slice(0, count).forEach(function(i) {
            const correct = CONCEPTS[i].title;
            const wrong = shuffle(CONCEPTS.filter(function(_, j) { return j !== i; }).map(function(c) { return c.title; })).slice(0, 3);
            qs.push({ kind:'concept', question: CONCEPTS[i].def.slice(0, 120) + '...', hint: "Quel concept ?", options: shuffle([correct].concat(wrong)), answer: correct });
        });
    }
    if (incA) {
        const count = type === 'mix' ? 1 : n;
        const accs = [
            {q:'101', a:'Capital social'}, {q:'401', a:'Fournisseurs'}, {q:'411', a:'Clients'},
            {q:'512', a:'Banque'}, {q:'607', a:'Achats de marchandises'}, {q:'707', a:'Ventes de marchandises'},
            {q:'641', a:'Rémunérations du personnel'}, {q:'213', a:'Constructions'}, {q:'164', a:'Emprunts'},
            {q:'530', a:'Caisse'}, {q:'4456', a:'TVA déductible'}, {q:'4457', a:'TVA collectée'}
        ];
        shuffle(accs).slice(0, count).forEach(function(a) {
            const wrong = shuffle(accs.filter(function(x) { return x.a !== a.a; }).map(function(x) { return x.a; })).slice(0, 3);
            qs.push({ kind:'account', question: a.q, hint: "Quel est ce compte ?", options: shuffle([a.a].concat(wrong)), answer: a.a });
        });
    }
    if (incJ) {
        const count = type === 'mix' ? 2 : n;
        shuffle(JOURNAL_ENTRIES).slice(0, count).forEach(function(e) {
            const correct = e.lines[0].label;
            const wrong = shuffle(JOURNAL_ENTRIES.filter(function(x) { return x.id !== e.id; }).map(function(x) { return x.lines[0].label; })).slice(0, 3);
            qs.push({ kind:'journal', question: e.desc.slice(0, 100) + '...', hint: "Compte à débiter en premier ?", options: shuffle([correct].concat(wrong)), answer: correct });
        });
    }
    if (incR) {
        const count = type === 'mix' ? 2 : n;
        shuffle(RATIOS).slice(0, count).forEach(function(r) {
            const correct = r.formula;
            const wrong = shuffle(RATIOS.filter(function(x) { return x.name !== r.name; }).map(function(x) { return x.formula; })).slice(0, 3);
            qs.push({ kind:'ratio', question: r.name, hint: "Quelle est la formule ?", options: shuffle([correct].concat(wrong)), answer: correct });
        });
    }
    if (incAu) {
        const count = type === 'mix' ? 2 : n;
        shuffle(AUDIT_CONCEPTS).slice(0, count).forEach(function(a) {
            const correct = a.title;
            const wrong = shuffle(AUDIT_CONCEPTS.filter(function(x) { return x.title !== a.title; }).map(function(x) { return x.title; })).slice(0, 3);
            qs.push({ kind:'audit', question: a.desc.slice(0, 110) + '...', hint: "Quel concept d'audit ?", options: shuffle([correct].concat(wrong)), answer: correct });
        });
    }
    if (incCalc) {
        qs.push.apply(qs, buildCalcQuestions(2));
    }
    return shuffle(qs).slice(0, n);
}

function answerQuiz(choice, btn) {
    const q = currentQuiz.questions[currentQuiz.index];
    const options = document.querySelectorAll('.quiz-option');
    options.forEach(function(o) { o.disabled = true; });
    if (choice === q.answer) {
        btn.classList.add('correct');
        currentQuiz.score++;
        state.stats.correct++; saveState();
        addXP(10, 'Bonne réponse');
        document.getElementById('quiz-feedback').textContent = '✅ Bonne réponse !';
        document.getElementById('quiz-feedback').className = 'quiz-feedback ok';
    } else {
        btn.classList.add('wrong');
        state.stats.wrong++;
        options.forEach(function(o) { if (o.getAttribute('data-answer') === q.answer) o.classList.add('correct'); });
        saveState();
        document.getElementById('quiz-feedback').textContent = '❌ Réponse : ' + q.answer;
        document.getElementById('quiz-feedback').className = 'quiz-feedback ko';
    }
    updateHeader();
    setTimeout(function() { currentQuiz.index++; renderQuiz(); }, 1400);
}
function renderQuizResult() {
    const area = document.getElementById('quiz-area');
    const total = currentQuiz.questions.length;
    const score = currentQuiz.score;
    const pct = Math.round((score / total) * 100);
    if (!state.stats.history) state.stats.history = [];
    state.stats.history.push({ date: Date.now(), type: currentQuiz.isDaily ? 'daily' : currentQuiz.type, score: score, total: total });
    if (state.stats.history.length > 100) state.stats.history = state.stats.history.slice(-100);
    if (score === total) {
        awardBadge('perfect-quiz');
        state.stats.perfectCount = (state.stats.perfectCount||0)+1;
        if (state.stats.perfectCount >= 3) awardBadge('perfect-3');
    }
    awardBadge('first-quiz');
    if (currentQuiz.isDaily) {
        state.lastDailyChallenge = todayKey();
        if (score >= 3) { addXP(50, 'Défi réussi'); awardBadge('daily-challenger'); }
    }
    saveState();
    let emoji = '😊', title = 'Pas mal !';
    if (pct === 100) { emoji = '🏆'; title = 'Parfait !'; }
    else if (pct >= 80) { emoji = '🎉'; title = 'Excellent !'; }
    else if (pct >= 60) { emoji = '👍'; title = 'Bien !'; }
    else if (pct >= 40) { emoji = '💪'; title = 'Continue'; }
    else { emoji = '📚'; title = 'À réviser'; }
    area.innerHTML = `
        <div class="quiz-panel result-panel">
            <div class="big-emoji">${emoji}</div>
            <div class="result-title">${title}</div>
            <div class="result-score">${score} / ${total} (${pct}%)</div>
            <div style="display:flex; gap:0.5rem; justify-content:center; flex-wrap:wrap;">
                <button class="btn btn-gold" id="replay-btn">🔄 Rejouer</button>
                <button class="btn btn-ghost" onclick="switchView('exercises')">← Autres</button>
            </div>
        </div>`;
    document.getElementById('replay-btn').addEventListener('click', function() { startQuiz(currentQuiz.isDaily ? 'mix' : currentQuiz.type); });
    if (pct >= 80) launchConfetti();
}

/* ============================================================
   RECHERCHE
   ============================================================ */
function renderSearch() {
    const el = document.getElementById('view-search');
    el.innerHTML = `
        <h2 class="section-title">🔎 Recherche globale</h2>
        <input class="search-input" type="text" id="global-search" placeholder="🔍 Rechercher dans tout le contenu..." oninput="performSearch()" autofocus>
        <div id="search-results" class="search-results">
            <p style="text-align:center; color:var(--text-dim); padding:2rem;">Tape pour rechercher...</p>
        </div>`;
}
function performSearch() {
    const q = document.getElementById('global-search').value.toLowerCase().trim();
    const results = document.getElementById('search-results');
    if (q.length < 2) { results.innerHTML = '<p style="text-align:center; color:var(--text-dim); padding:2rem;">Tape au moins 2 caractères...</p>'; return; }
    const found = [];
    CONCEPTS.forEach(function(c) {
        if ((c.title + ' ' + c.def + ' ' + c.cat).toLowerCase().indexOf(q) !== -1) {
            found.push({ type: 'Concept', title: c.title, sub: c.def.slice(0, 100), action: "switchView('concepts')" });
        }
    });
    LEXICON.forEach(function(l) {
        if ((l.term + ' ' + l.def).toLowerCase().indexOf(q) !== -1) {
            found.push({ type: 'Lexique', title: l.term, sub: l.def.slice(0, 100), action: "switchView('lexicon')" });
        }
    });
    JOURNAL_ENTRIES.forEach(function(e) {
        if ((e.title + ' ' + e.desc + ' ' + e.explanation).toLowerCase().indexOf(q) !== -1) {
            found.push({ type: 'Écriture', title: e.title, sub: e.desc.slice(0, 100), action: "switchView('journal')" });
        }
    });
    RATIOS.forEach(function(r) {
        if ((r.name + ' ' + r.formula + ' ' + r.interp).toLowerCase().indexOf(q) !== -1) {
            found.push({ type: 'Ratio', title: r.name, sub: r.formula, action: "switchView('ratios')" });
        }
    });
    AUDIT_CONCEPTS.forEach(function(a) {
        if ((a.title + ' ' + a.desc).toLowerCase().indexOf(q) !== -1) {
            found.push({ type: 'Audit', title: a.title, sub: a.desc.slice(0, 100), action: "switchView('audit')" });
        }
    });
    CASE_STUDIES.forEach(function(c) {
        if ((c.title + ' ' + c.context + ' ' + c.answer).toLowerCase().indexOf(q) !== -1) {
            found.push({ type: 'Cas', title: c.title, sub: c.context.slice(0, 100), action: "switchView('cases')" });
        }
    });
    if (found.length === 0) { results.innerHTML = '<p style="text-align:center; color:var(--text-dim); padding:2rem;">Aucun résultat</p>'; return; }
    results.innerHTML = found.slice(0, 40).map(function(r) {
        return '<div class="search-result" style="background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:0.8rem 1rem; cursor:pointer;" onclick="' + r.action + '">' +
            '<div style="font-size:0.65rem; color:var(--accent-light); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:0.2rem;">' + r.type + '</div>' +
            '<div style="font-size:0.9rem; font-weight:600;">' + highlight(r.title, q) + '</div>' +
            '<div style="font-size:0.78rem; color:var(--text-dim); margin-top:0.15rem;">' + highlight(r.sub, q) + '</div>' +
        '</div>';
    }).join('');
}

/* ============================================================
   STATS
   ============================================================ */
function renderStats() {
    const el = document.getElementById('view-stats');
    const total = state.stats.correct + state.stats.wrong;
    const acc = total > 0 ? Math.round(100 * state.stats.correct / total) : 0;
    const history = (state.stats.history || []).slice(-10).reverse();
    const lvl = levelFromXP(state.xp);
    const days = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
    const last7 = [];
    for (let i = 6; i >= 0; i--) {
        const d = new Date(Date.now() - i * 86400000);
        const key = d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
        const count = (state.stats.history || []).filter(function(h) {
            const hd = new Date(h.date);
            const hk = hd.getFullYear() + '-' + (hd.getMonth()+1) + '-' + hd.getDate();
            return hk === key;
        }).length;
        last7.push({ label: days[d.getDay()], count: count });
    }
    const maxCount = Math.max(1, ...last7.map(function(d) { return d.count; }));
    el.innerHTML = `
        <h2 class="section-title">📊 Statistiques</h2>
        <div class="dashboard-grid">
            <div class="dash-card"><div class="icon">⭐</div><div class="label">XP</div><div class="value">${state.xp}</div><div class="sub">Niv. ${lvl}</div></div>
            <div class="dash-card"><div class="icon">🔥</div><div class="label">Série</div><div class="value">${state.streak}</div><div class="sub">jours</div></div>
            <div class="dash-card"><div class="icon">🎯</div><div class="label">Précision</div><div class="value">${acc}%</div><div class="sub">${state.stats.correct}/${total}</div></div>
            <div class="dash-card"><div class="icon">🏅</div><div class="label">Badges</div><div class="value">${state.earnedBadges.length}/${BADGES.length}</div><div class="sub">débloqués</div></div>
        </div>
        <div class="card">
            <div class="card-title">📅 Activité (7 jours)</div>
            <div class="bar-chart">
                ${last7.map(function(d) {
                    const h = Math.round((d.count / maxCount) * 100);
                    return '<div class="bar-col"><div class="bar-fill" style="height:' + h + '%"></div><div class="bar-label">' + d.label + '</div></div>';
                }).join('')}
            </div>
        </div>
        <div class="card">
            <div class="card-title">🎓 Progression détaillée</div>
            <div style="display:grid; gap:0.8rem;">
                <div><div class="progress-label"><span>📚 Concepts</span><span>${state.learnedConcepts.length}/${CONCEPTS.length}</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${(state.learnedConcepts.length/CONCEPTS.length)*100}%"></div></div></div>
                <div><div class="progress-label"><span>💡 Lexique</span><span>${state.learnedWords.length}/${LEXICON.length}</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${(state.learnedWords.length/LEXICON.length)*100}%"></div></div></div>
                <div><div class="progress-label"><span>📝 Écritures</span><span>${state.viewedEntries.length}/${JOURNAL_ENTRIES.length}</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${(state.viewedEntries.length/JOURNAL_ENTRIES.length)*100}%"></div></div></div>
                <div><div class="progress-label"><span>📈 Ratios</span><span>${state.viewedRatios.length}/${RATIOS.length}</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${(state.viewedRatios.length/RATIOS.length)*100}%"></div></div></div>
                <div><div class="progress-label"><span>🔍 Audit</span><span>${state.viewedAudit.length}/${AUDIT_CONCEPTS.length}</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${(state.viewedAudit.length/AUDIT_CONCEPTS.length)*100}%"></div></div></div>
                <div><div class="progress-label"><span>📋 Cas pratiques</span><span>${state.exploredCases.length}/${CASE_STUDIES.length}</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${(state.exploredCases.length/CASE_STUDIES.length)*100}%"></div></div></div>
            </div>
        </div>
        <div class="card">
            <div class="card-title">📝 Historique des quiz</div>
            ${history.length === 0 ? '<p style="color:var(--text-dim); font-size:0.85rem;">Aucun quiz encore.</p>' :
                '<div class="history-list">' + history.map(function(h) {
                    const d = new Date(h.date);
                    const dateStr = d.toLocaleDateString('fr-FR', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
                    return '<div class="history-item">' +
                        '<span>' + (h.type === 'daily' ? '🌅' : h.type === 'calc' ? '🧮' : '🎯') + ' ' + (h.type||'Quiz') + '</span>' +
                        '<span class="h-score">' + h.score + '/' + h.total + '</span>' +
                        '<span class="h-date">' + dateStr + '</span></div>';
                }).join('') + '</div>'}
        </div>`;
}

        <div class="card">
            <div class="card-title">🎨 Apparence</div>
            <div class="setting-row">

                <button class="toggle ${state.settings.theme === 'light' ? 'on' : ''}" id="theme-toggle"></button>

            <div class="card-title">🎯 Objectif quotidien</div>
            <div class="setting-row">
                <div><div class="s-label">XP / jour</div><div class="s-desc">${state.dailyGoal} XP</div></div>
                <input type="range" id="goal-range" min="10" max="100" step="10" value="${state.dailyGoal}" style="accent-color:var(--accent);">

            <div class="card-title">💾 Données</div>

            <div class="setting-row">
                <div><div class="s-label">Importer</div><div class="s-desc">Restaurer</div></div>

            </div>

                <div><div class="s-label" style="color:var(--error);">Réinitialiser</div><div class="s-desc">Tout effacer</div></div>
                <button class="btn btn-danger btn-sm" onclick="resetProgress()">🗑️</button>
            </div>
        </div>
        <div class="card">
            <div class="card-title">ℹ️ À propos</div>
            <p style="color:var(--text-dim); font-size:0.85rem; line-height:1.7;">
                <strong>ComptaPro v2.0</strong><br>
                ${CONCEPTS.length} concepts · ${LEXICON.length} termes · ${JOURNAL_ENTRIES.length} écritures · ${RATIOS.length} ratios · ${AUDIT_CONCEPTS.length} concepts audit · ${CASE_STUDIES.length} cas pratiques · 9 calculateurs<br>
                📚 Fondamentaux comptables · 📊 États financiers · 📈 Analyse financière · 🔍 Audit & contrôle<br>
                Données stockées localement dans ton navigateur. Aucune connexion requise.
            </p>
        </div>`;
    document.getElementById('theme-toggle').addEventListener('click', function() {
        state.settings.theme = state.settings.theme === 'light' ? 'dark' : 'light';
        applyTheme(); saveState();
        this.classList.toggle('on', state.settings.theme === 'light');
    });
    document.getElementById('goal-range').addEventListener('change', function() {
        state.dailyGoal = parseInt(this.value); saveState();
        this.previousElementSibling.querySelector('.s-desc').textContent = this.value + ' XP';
    });
}
function applyTheme() { document.body.classList.toggle('light', state.settings.theme === 'light'); }
function exportData() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url;
    a.download = 'comptapro-sauvegarde-' + todayKey() + '.json';
    a.click(); URL.revokeObjectURL(url);
    showToast('📤 Exporté');
}
function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const imported = JSON.parse(e.target.result);
            if (!imported || typeof imported !== 'object') throw new Error();
            state = { ...defaultState, ...imported,
                stats: { ...defaultState.stats, ...(imported.stats || {}) },
                settings: { ...defaultState.settings, ...(imported.settings || {}) },
                vocabSRS: imported.vocabSRS || {} };
            saveState(); applyTheme(); updateHeader(); renderSettings();
            showToast('✅ Restauré');
        } catch (err) { showToast('❌ Fichier invalide'); }
    };
    reader.readAsText(file);
}
function resetProgress() {
    if (!confirm('⚠️ Effacer toute la progression ?')) return;
    localStorage.removeItem(STORAGE_KEY);
    state = JSON.parse(JSON.stringify(defaultState));
    saveState(); applyTheme(); updateHeader(); renderSettings();
    showToast('🗑️ Réinitialisé');
}

/* ============================================================
   INIT
   ============================================================ */
(function init() {
    applyTheme();
    updateStreak();
    resetDailyXPIfNeeded();
    checkBadges();
    updateHeader();
    renderHome();
    document.getElementById('modal').addEventListener('click', function(e) {
        if (e.target.id === 'modal') closeModal();
    });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeModal();
    });
    saveState();
})();
</script>
